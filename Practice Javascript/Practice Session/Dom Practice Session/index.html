  <title>Dom Practice Session</title>
  <style>
/* Form Container */

.form-container{
    width:90%;
    max-width:700px;
    margin:40px auto;

    display:flex;
    gap:15px;
    align-items:center;
}

/* Inputs */

.form-container input{
    flex:1;
    padding:14px 18px;

    border:2px solid #e5e7eb;
    border-radius:10px;

    font-size:16px;
    outline:none;

    transition:.3s;
}

.form-container input:focus{
    border-color:#0077ff;
    box-shadow:0 0 8px rgba(0,119,255,.2);
}

/* Button */

.add{
    padding:14px 24px;

    border:none;
    border-radius:10px;

    background:#0077ff;
    color:white;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
    transition:.3s;
}

.add:hover{
    background:#005fcc;
    transform:translateY(-2px);
}

.add:active{
    transform:scale(.97);
}

/* Mobile */

@media(max-width:600px){

    .form-container{
        flex-direction:column;
    }

    .form-container input,
    .add{
        width:100%;
    }

}
    #students {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.student-card {
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

  display: flex;
  justify-content: space-between;
  align-items: center;

  transition: 0.3s;
}

.student-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
}

.student-name {
  font-size: 20px;
  color: #222;
  margin-bottom: 6px;
}

.student-course {
  color: #666;
  font-size: 15px;
}

.delete-btn {
  background: #e63946;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

.delete-btn:hover {
  background: #c1121f;
}

#totalStudents {
  color: #0077ff;
  font-weight: bold;
}
  </style>
</head>
