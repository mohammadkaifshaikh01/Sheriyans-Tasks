<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Notes App</title>
   <link rel="stylesheet" href="style.css">
   <link rel="shortcut icon" href="https://static.vecteezy.com/system/resources/thumbnails/023/492/712/small/3d-notes-icon-png.png" type="image/x-icon">
</head>

<body>
   <main>
      <nav>
         <div class="logo">Notes App</div>
         <div>
            <button class="formOpenButton">Create Notes</button>
         </div>
      </nav>

      <div class="searchBar">
         <input class="searchInput" type="text" placeholder="Search Task">
         <button class="searchButton">Searh</button>
      </div>

      <div class="notes">
         <!-- <div class="note">
            <div class="note-part-one">
               <h1>Note Name</h1>
               <p>Description</p>
               <p>Created At</p>
            </div>
            <div class="note-part-two">
               <button class="updateButton">Update</button>
               <button class="deleteButton">Delete</button>
            </div>
         </div> -->
      </div>

      <div class="formBar">

         <div class="popup">

            <div class="popup-header">
               <h3>Create Note</h3>
               <button class="formClose">✕</button>
            </div>

            <form>
               <input type="text" placeholder="Enter Note Name">
               <input type="text" placeholder="Enter Description">
               <button class="submitButton" type="submit">Submit</button>
            </form>

         </div>

      </div>
   </main>
   <script src="script.js"></script>
</body>

</html>
