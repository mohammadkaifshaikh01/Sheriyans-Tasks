<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup & connecting the CDN</title>
    <style>
      .box {
        width: 150px;
        height: 150px;
        background-color: rgb(230, 255, 196);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
      }
      p {
        font-size: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>Hello Kaif</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script>
      // console.log(gsap, "Gsap");
      // console.log(gsap.version, "Gsap");
      // console.log(typeof gsap, "Gsap");

      gsap.to('.box',{
         rotation:200,
         duration:2
      })
       gsap.to('.box',{
         y:300,
         duration:2
      })
       gsap.to('.box',{
         x:500,
         duration:2
      })
    </script>
  </body>
</html>
